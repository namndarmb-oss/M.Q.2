<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b10">
<title>M.Q.Chat X | نسخه نهایی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mqtt@5.3.6/dist/mqtt.min.js"></script>
<style>
:root{--bg:#0a0b10;--panel:#12141d;--panel-2:#1a1e2b;--border:rgba(255,255,255,.08);--text:#e9ebf2;--muted:#8a90a6;--accent:#7c6cff;--accent-2:#a855f7;--ok:#22c55e;--bad:#ff5566;--warn:#f59e0b;--bubble-me:linear-gradient(135deg,var(--accent),var(--accent-2));--bubble-them:#1c2130;--shadow:0 10px 40px rgba(0,0,0,.5)}
[data-theme=light]{--bg:#eef1f7;--panel:#fff;--panel-2:#f7f8fc;--border:rgba(15,20,40,.09);--text:#141a2b;--muted:#6b7280;--bubble-them:#fff;--shadow:0 10px 40px rgba(30,40,80,.12)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
.blur-mode #messages{filter:blur(20px);pointer-events:none;user-select:none}

/* AUTH */
.auth-screen{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px;background:radial-gradient(900px 500px at 20% 10%,#7c6cff33,transparent 60%),radial-gradient(800px 500px at 90% 90%,#a855f733,transparent 60%),var(--bg);overflow-y:auto}
.auth-card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--border);border-radius:26px;padding:26px 22px;box-shadow:var(--shadow)}
.auth-logo{width:72px;height:72px;margin:0 auto 12px;border-radius:20px;background:linear-gradient(135deg,#7c6cff,#a855f7);display:grid;place-items:center;font-size:32px;box-shadow:0 14px 40px -10px var(--accent)}
.auth-card h1{font-size:20px;text-align:center;font-weight:700;margin-bottom:4px}
.auth-card .sub{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:18px;line-height:1.8}
.tabs-auth{display:flex;gap:6px;background:var(--panel-2);padding:4px;border-radius:14px;margin-bottom:16px}
.tabs-auth button{flex:1;padding:9px;border-radius:11px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs-auth button.active{background:var(--panel);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input,.field select,.field textarea{width:100%;background:var(--panel-2);border:1.5px solid var(--border);border-radius:13px;padding:11px 15px;font-size:14px;outline:none;transition:.18s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #7c6cff33}
.field small{font-size:11px;color:var(--muted);display:block;margin-top:5px}
.avatar-upload{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:14px}
.avatar-preview{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--panel-2);border:2px dashed var(--border);overflow:hidden;cursor:pointer;transition:.2s}
.avatar-preview:hover{border-color:var(--accent)}
.avatar-preview img{width:100%;height:100%;object-fit:cover}
.btn{width:100%;padding:13px;border-radius:14px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.btn.primary{background:var(--bubble-me);color:#fff;box-shadow:0 10px 28px -8px var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--panel-2);border:1px solid var(--border)}
.btn.ghost:hover{background:rgba(255,255,255,.05)}
.btn.danger{background:#ff4d4f22;color:var(--bad);border:1px solid #ff4d4f44}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:8px;margin-top:6px}
.auth-divider{display:flex;align-items:center;gap:10px;margin:18px 0;font-size:11px;color:var(--muted)}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.admin-login-btn{width:100%;padding:11px;border-radius:12px;background:linear-gradient(135deg,#1e1e2e,#2a1f3d);border:1px solid #7c6cff44;color:#a5a0d6;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:.2s}
.admin-login-btn:hover{background:linear-gradient(135deg,#2a1f3d,#3a2a5d);border-color:#7c6cff88;color:#fff}

/* APP */
.app{position:relative;display:flex;height:100vh;height:100dvh;max-width:1500px;margin:0 auto;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.sidebar{width:340px;flex:0 0 340px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.side-head{display:flex;align-items:center;gap:6px;padding:10px 10px;border-bottom:1px solid var(--border)}
.side-head .who{flex:1;min-width:0}
.side-head .who b{display:block;font-size:14px;font-weight:700;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-head .who small{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:0 0 auto}
.conn-dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.conn-dot.off{background:var(--bad)}
.reconnect-btn{display:none;background:var(--bad);color:#fff;font-size:10px;padding:2px 8px;border-radius:8px;cursor:pointer;font-weight:600;border:none}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;transition:.15s;flex:0 0 auto;position:relative}
.icon-btn:hover{background:rgba(255,255,255,.06)}
.avatar{position:relative;width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:grid;place-items:center;font-size:18px;user-select:none;background:color-mix(in srgb,var(--c,#7c6cff) 26%,transparent);border:1.5px solid color-mix(in srgb,var(--c,#7c6cff) 55%,transparent);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar .dot{position:absolute;bottom:0;left:0;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--panel)}
.avatar.small{width:30px;height:30px;flex:0 0 30px;font-size:14px}

.folders{display:flex;gap:3px;padding:6px 10px 0;overflow-x:auto}
.folders button{flex:0 0 auto;padding:6px 10px;border-radius:10px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.folders button.active{background:var(--panel-2);color:var(--text)}
.search-box{margin:8px 10px;display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1.5px solid var(--border);border-radius:12px;padding:8px 12px}
.search-box:focus-within{border-color:var(--accent)}
.search-box input{border:none;background:none;outline:none;flex:1;font-size:12.5px;min-width:0}
.chat-list{flex:1;overflow-y:auto;padding:0 6px 12px}
.no-result{text-align:center;color:var(--muted);font-size:12px;padding:24px 12px;line-height:2}
.no-result .big{font-size:30px;display:block;margin-bottom:6px;opacity:.6}
.chat-item{width:100%;display:flex;align-items:center;gap:10px;padding:9px;border-radius:14px;text-align:right;transition:background .15s;margin-bottom:2px}
.chat-item:hover{background:rgba(255,255,255,.05)}
.chat-item.active{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.ci-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ci-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ci-top strong{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px}
.ci-top time{font-size:10px;color:var(--muted);flex:0 0 auto}
.ci-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ci-preview{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.badge{background:var(--accent);color:#fff;font-size:10px;font-weight:600;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;flex:0 0 auto}
.tick{color:#5ec8ff;font-size:10px;letter-spacing:-2px}
.tag-online{font-size:9.5px;background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok);padding:2px 6px;border-radius:6px;font-weight:600}
.tag-group{font-size:9.5px;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);padding:2px 6px;border-radius:6px;font-weight:600}
.tag-channel{font-size:9.5px;background:color-mix(in srgb,#f59e0b 22%,transparent);color:#f59e0b;padding:2px 6px;border-radius:6px;font-weight:600}
.tag-secret{font-size:9.5px;background:color-mix(in srgb,#ef4444 22%,transparent);color:#ef4444;padding:2px 6px;border-radius:6px;font-weight:600}
.tag-saved{font-size:9.5px;background:color-mix(in srgb,#10b981 22%,transparent);color:#10b981;padding:2px 6px;border-radius:6px;font-weight:600}
.tag-admin{font-size:9.5px;background:#ef4444;color:#fff;padding:2px 6px;border-radius:6px;font-weight:700}

.chat-panel{flex:1;display:flex;flex-direction:column;min-width:0;background:radial-gradient(1000px 500px at 80% -10%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 60%),var(--panel)}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:30px}
.empty-emoji{font-size:56px}
.empty-state h2{font-size:18px;font-weight:600}
.empty-state p{font-size:13px;color:var(--muted);max-width:340px;line-height:1.9}
.chat-view{flex:1;display:flex;flex-direction:column;min-height:0}
.chat-head{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(14px);position:relative;z-index:3}
.peer-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.peer-info strong{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.peer-info small{font-size:10.5px;color:var(--muted)}
.peer-info small.online{color:var(--ok)}
.back-btn{display:none;font-size:18px}
.chat-head-actions{position:relative;display:flex;gap:1px}
.dropdown{position:absolute;top:42px;left:0;z-index:20;background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:6px;min-width:220px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.dropdown button{display:block;width:100%;text-align:right;padding:8px 11px;border-radius:9px;font-size:12.5px;transition:background .15s}
.dropdown button:hover{background:rgba(255,255,255,.05)}
.dropdown button.danger{color:var(--bad)}
.pinned-banner{padding:7px 12px;background:var(--panel-2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:11.5px;cursor:pointer}
.pinned-banner b{color:var(--accent);font-size:10.5px;display:block}
.pinned-banner span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.messages{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:3px;transition:filter .3s}
.day-sep{display:flex;justify-content:center;margin:12px 0 8px}
.day-sep span{background:var(--panel-2);border:1px solid var(--border);color:var(--muted);font-size:10.5px;padding:3px 12px;border-radius:18px}
.row{display:flex;margin:1px 0;gap:5px;align-items:flex-end}
.row.them{justify-content:flex-start}
.row.mine{justify-content:flex-end}
.bubble{max-width:min(78%,540px);padding:7px 12px 5px;border-radius:16px;font-size:13px;line-height:1.6;display:flex;flex-direction:column;gap:3px;animation:msgIn .22s ease;word-break:break-word;position:relative;cursor:pointer}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.98)}}
.row.them .bubble{background:var(--bubble-them);border:1px solid var(--border);border-bottom-right-radius:5px}
.row.mine .bubble{background:var(--bubble-me);color:#fff;border-bottom-left-radius:5px;box-shadow:0 6px 18px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
.bubble .txt{white-space:pre-wrap}
.bubble .meta{font-size:9.5px;opacity:.65;display:flex;align-items:center;gap:3px;align-self:flex-end;flex-wrap:wrap}
.bubble img.att{max-width:100%;max-height:260px;border-radius:10px;display:block}
.bubble video{max-width:260px;max-height:300px;border-radius:10px;display:block}
.bubble video.vnote{width:160px;height:160px;border-radius:50%;object-fit:cover;background:#000}
.bubble audio{max-width:220px;border-radius:10px;display:block}
.file-att{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.08);min-width:180px;text-decoration:none;color:inherit;transition:.15s;font-size:12px}
.row.mine .file-att{background:rgba(255,255,255,.16)}
.file-att .fi{font-size:22px}
.file-att .info{flex:1;min-width:0}
.file-att .info b{display:block;font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-att .info small{font-size:10px;opacity:.7}
.bubble .reply-quote{padding:5px 9px;border-right:3px solid currentColor;background:rgba(0,0,0,.15);border-radius:7px;font-size:11px;opacity:.85;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px}
.bubble .fwd-tag{font-size:9.5px;opacity:.7;font-style:italic}
.bubble .edited-tag{font-size:9px;opacity:.65}
.bubble .sender-name{font-size:10.5px;font-weight:700;color:var(--accent);margin-bottom:1px}
.bubble .silent-tag{font-size:9px;opacity:.65;color:var(--warn)}
.bubble .bot-tag{font-size:9px;opacity:.75;background:rgba(124,108,255,.25);padding:1px 5px;border-radius:5px}
.bubble .translated{font-size:11px;color:var(--ok);padding:3px 7px;background:rgba(34,197,94,.15);border-radius:5px;margin-top:3px;border-right:2px solid var(--ok)}
.link-preview{margin-top:3px;padding:7px;border-radius:9px;background:rgba(0,0,0,.15);border-left:3px solid var(--accent)}
.link-preview .lp-title{font-size:11.5px;font-weight:600;margin-bottom:2px}
.link-preview .lp-host{font-size:9.5px;opacity:.6;margin-top:2px;direction:ltr;text-align:left}
.view-once{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,.08);border-radius:10px;cursor:pointer}
.countdown-badge{background:var(--bad);color:#fff;font-size:8.5px;padding:1px 5px;border-radius:7px;font-weight:700}

.reply-bar{display:flex;align-items:center;gap:6px;padding:7px 12px;background:var(--panel-2);border-top:1px solid var(--border);font-size:11.5px}
.reply-bar .bar{border-right:3px solid var(--accent);padding-right:7px;flex:1;min-width:0;overflow:hidden}
.reply-bar .bar b{display:block;font-size:11px;color:var(--accent)}
.reply-bar .bar span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edit-bar{background:color-mix(in srgb,var(--warn) 12%,var(--panel-2))}

.composer{display:flex;align-items:center;gap:4px;padding:7px 8px 10px;border-top:1px solid var(--border);background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(14px);position:relative}
.composer input{flex:1;min-width:0;background:var(--panel-2);border:1.5px solid var(--border);border-radius:20px;padding:10px 14px;font-size:13px;outline:none;transition:.18s}
.composer input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #7c6cff33}
.send-btn{width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:var(--bubble-me);color:#fff;font-size:16px;display:grid;place-items:center;box-shadow:0 6px 18px -6px var(--accent);transition:transform .12s}
.send-btn span{display:block;transform:rotate(180deg)}
.send-btn:active{transform:scale(.92)}
.send-btn.rec{background:linear-gradient(135deg,#ef4444,#dc2626);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}50%{box-shadow:0 0 0 12px rgba(239,68,68,0)}}
.emoji-panel{position:absolute;bottom:66px;right:12px;width:320px;max-height:280px;overflow-y:auto;background:var(--panel-2);border:1px solid var(--border);border-radius:16px;padding:9px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;box-shadow:0 18px 50px rgba(0,0,0,.5);z-index:10}
.emoji-panel button{font-size:19px;padding:4px;border-radius:8px;line-height:1;transition:.12s}
.emoji-panel button:hover{background:rgba(255,255,255,.05);transform:scale(1.15)}
.attach-menu{position:absolute;bottom:66px;right:55px;background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:5px;min-width:200px;box-shadow:0 18px 50px rgba(0,0,0,.5);z-index:10;max-height:400px;overflow-y:auto}
.attach-menu button{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:9px;font-size:12.5px;text-align:right;transition:.15s}
.attach-menu button:hover{background:rgba(255,255,255,.05)}
.upload-bar{position:absolute;bottom:100%;left:12px;right:12px;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px;font-size:11.5px}
.upload-bar .prog{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.upload-bar .prog i{display:block;height:100%;background:var(--accent);transition:width .2s}

.msg-menu{position:fixed;z-index:80;background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:5px;min-width:180px;max-height:400px;overflow-y:auto;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.msg-menu button{display:block;width:100%;text-align:right;padding:8px 11px;border-radius:9px;font-size:12.5px;transition:background .15s;color:var(--text)}
.msg-menu button:hover{background:rgba(255,255,255,.05)}
.msg-menu button.danger{color:var(--bad)}

.overlay{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.55);backdrop-filter:blur(5px);display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .18s}
.overlay.open{opacity:1}
.modal{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6);max-height:92vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.modal p{font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:12px}
.modal-actions{display:flex;gap:8px;margin-top:12px}
.setting-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border)}
.setting-row:last-child{border:none}
.setting-row .sbody{flex:1;min-width:0}
.setting-row .sbody b{display:block;font-size:12.5px;font-weight:600}
.setting-row .sbody small{font-size:10.5px;color:var(--muted)}
.switch{position:relative;width:42px;height:24px;flex:0 0 42px;border-radius:12px;background:var(--border);transition:.2s;cursor:pointer}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--accent)}
.switch.on::after{left:calc(100% - 21px)}
.member-row{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:10px;margin-bottom:2px}
.member-row:hover{background:rgba(255,255,255,.04)}
.member-row .mbody{flex:1;min-width:0}
.member-row .mbody b{display:block;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member-row .mbody small{font-size:10.5px;color:var(--muted)}

.status-bar{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;border-bottom:1px solid var(--border)}
.status-item{flex:0 0 auto;width:52px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.status-item .ring{width:48px;height:48px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#7c6cff,#a855f7)}
.status-item .ring .inner{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--panel);font-size:20px;border:2px solid var(--panel)}
.status-item .ring .inner img{width:100%;height:100%;object-fit:cover}
.status-item small{font-size:9.5px;color:var(--muted);max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.status-item.add .ring{background:var(--panel-2);display:grid;place-items:center;font-size:20px}
.status-item.add .ring .inner{border:1px dashed var(--accent);color:var(--accent)}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
.gallery .gitem{aspect-ratio:1;border-radius:7px;overflow:hidden;cursor:pointer;position:relative;background:var(--panel-2)}
.gallery .gitem img,.gallery .gitem video{width:100%;height:100%;object-fit:cover}
.gallery .gicon{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;font-size:9.5px;padding:1px 4px;border-radius:5px}
.chat-search{display:flex;align-items:center;gap:6px;padding:7px 12px;background:var(--panel-2);border-bottom:1px solid var(--border)}
.chat-search input{flex:1;background:transparent;border:none;outline:none;font-size:12px;color:var(--text)}
.chat-search .count{font-size:10.5px;color:var(--muted)}

.call-overlay{position:fixed;inset:0;z-index:300;background:#0a0c14;display:flex;flex-direction:column}
.call-stage{flex:1;position:relative;overflow:hidden;background:#06070c}
#remoteVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#localVideo{position:absolute;bottom:100px;left:14px;width:110px;height:160px;object-fit:cover;border-radius:14px;border:2px solid rgba(255,255,255,.18);box-shadow:0 10px 40px rgba(0,0,0,.6);background:#000;transform:scaleX(-1);z-index:2}
#screenVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:1;display:none}
.call-info{position:absolute;top:20px;right:20px;left:20px;display:flex;align-items:center;gap:10px;z-index:3;background:rgba(0,0,0,.42);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:9px 12px;color:#fff}
.call-info .avatar{width:36px;height:36px;flex:0 0 36px;font-size:17px}
.call-info .txt b{display:block;font-size:13px}
.call-info .txt small{font-size:10.5px;opacity:.72}
.call-controls{position:absolute;bottom:0;left:0;right:0;padding:20px;display:flex;justify-content:center;gap:12px;background:linear-gradient(to top,rgba(0,0,0,.75),transparent);z-index:3}
.call-btn{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:20px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);transition:.15s}
.call-btn:hover{background:rgba(255,255,255,.24)}
.call-btn.off{background:rgba(255,255,255,.05);opacity:.5}
.call-btn.hangup{background:#ef4444;border-color:#ef4444}

/* ============ ADMIN PANEL ============ */
.admin-panel{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;max-height:92vh;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.admin-header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,color-mix(in srgb,#ef4444 15%,var(--panel)),var(--panel))}
.admin-header h3{flex:1;font-size:15px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px}
.admin-badge{font-size:9.5px;background:#ef4444;color:#fff;padding:2px 7px;border-radius:5px;font-weight:700;animation:pulseRed 2s infinite}
@keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
.admin-tabs{display:flex;gap:2px;overflow-x:auto;padding:7px 10px;border-bottom:1px solid var(--border);background:var(--panel-2)}
.admin-tabs button{flex:0 0 auto;padding:7px 11px;border-radius:9px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap;transition:.15s;background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:4px}
.admin-tabs button.active{background:var(--panel);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.admin-tabs button:hover:not(.active){background:rgba(255,255,255,.05)}
.admin-tabs .notif{background:#ef4444;color:#fff;font-size:8.5px;padding:1px 4px;border-radius:6px;font-weight:700}
.admin-body{flex:1;overflow-y:auto;padding:14px 16px}

.admin-stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.admin-stat{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:10px;position:relative;overflow:hidden}
.admin-stat::before{content:'';position:absolute;top:0;right:0;width:3px;height:100%;background:var(--accent)}
.admin-stat.warn::before{background:var(--warn)}
.admin-stat.bad::before{background:var(--bad)}
.admin-stat.ok::before{background:var(--ok)}
.admin-stat .label{font-size:10px;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:3px}
.admin-stat .value{font-size:19px;font-weight:700;color:var(--text)}
.admin-stat .value.ok{color:var(--ok)}
.admin-stat .value.bad{color:var(--bad)}
.admin-stat .value.warn{color:var(--warn)}

.admin-section{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.admin-section h4{font-size:12.5px;font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:6px;justify-content:space-between}
.admin-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.admin-row:last-child{border:none}
.admin-row .rbody{flex:1;min-width:0}
.admin-row .rbody b{display:block;font-weight:600;font-size:12.5px}
.admin-row .rbody small{color:var(--muted);font-size:10.5px;display:block;margin-top:2px}
.admin-btn{padding:6px 11px;border-radius:8px;font-size:11.5px;font-weight:600;transition:.15s;background:var(--panel);border:1px solid var(--border);color:var(--text);cursor:pointer;white-space:nowrap}
.admin-btn:hover{background:rgba(255,255,255,.06)}
.admin-btn.danger{background:#ff4d4f22;color:var(--bad);border-color:#ff4d4f44}
.admin-btn.danger:hover{background:#ff4d4f33}
.admin-btn.primary{background:var(--bubble-me);color:#fff;border:none}
.admin-btn.primary:hover{filter:brightness(1.15)}
.admin-btn.ok{background:#22c55e22;color:var(--ok);border-color:#22c55e44}
.admin-btn.warn{background:#f59e0b22;color:var(--warn);border-color:#f59e0b44}
.admin-btn:disabled{opacity:.4;cursor:not-allowed}
.admin-input{width:100%;padding:9px 12px;border-radius:9px;background:var(--panel);border:1px solid var(--border);font-size:12.5px;outline:none;color:var(--text);font-family:inherit;resize:vertical;transition:.15s}
.admin-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #7c6cff22}

.monitor-feed{background:#000;border-radius:10px;padding:10px;max-height:480px;overflow-y:auto;font-size:12px;line-height:1.7;direction:rtl}
.monitor-msg{padding:7px 9px;border-radius:9px;margin-bottom:5px;background:rgba(255,255,255,.04);border-right:3px solid var(--accent)}
.monitor-msg.from-a{border-right-color:#38bdf8}
.monitor-msg.from-b{border-right-color:#f472b6}
.monitor-msg.offline{opacity:.75;border-right-style:dashed}
.monitor-header{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:3px}
.monitor-header .mname{color:var(--accent);font-weight:700;font-size:11px}
.monitor-body{color:#e5e5e5;word-break:break-word;white-space:pre-wrap}
.monitor-body img{max-width:180px;max-height:180px;border-radius:7px;display:block;margin-top:3px}
.monitor-empty{text-align:center;color:#666;padding:26px;font-size:11.5px}
.monitor-controls{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
.monitor-controls input{flex:1;min-width:140px;padding:6px 10px;border-radius:7px;background:#000;border:1px solid var(--border);color:var(--text);font-size:11.5px;outline:none}
.monitor-controls select{padding:6px 10px;border-radius:7px;background:#000;border:1px solid var(--border);color:var(--text);font-size:11.5px;outline:none}

.admin-log{background:#000;border-radius:9px;padding:10px;font-family:monospace;font-size:10.5px;line-height:1.6;max-height:380px;overflow-y:auto;direction:ltr;text-align:left}
.admin-log .log-row{display:flex;gap:6px;margin-bottom:2px;white-space:nowrap}
.admin-log .log-time{color:#666;flex:0 0 auto;font-size:9.5px}
.admin-log .log-type{flex:0 0 42px;font-weight:700;font-size:9.5px}
.admin-log .log-type.info{color:#38bdf8}
.admin-log .log-type.ok{color:#22c55e}
.admin-log .log-type.warn{color:#f59e0b}
.admin-log .log-type.err{color:#ff5566}
.admin-log .log-type.audit{color:#a855f7}
.admin-log .log-msg{color:#ccc;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.admin-empty{text-align:center;color:var(--muted);padding:18px;font-size:11.5px;line-height:1.8}
.bar-chart{display:flex;gap:3px;align-items:flex-end;height:80px;padding:8px;background:var(--panel);border-radius:8px;overflow-x:auto}
.bar-chart .bar{flex:1;min-width:12px;background:linear-gradient(to top,var(--accent),var(--accent-2));border-radius:3px 3px 0 0;position:relative;transition:height .3s}
.bar-chart .bar:hover{filter:brightness(1.2)}
.bar-chart .bar::after{content:attr(data-label);position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--muted);white-space:nowrap}

@media(max-width:820px){
  .sidebar{position:absolute;inset:0;width:100%;flex:1 1 100%;z-index:5}
  .chat-panel{position:absolute;inset:0;z-index:6;transform:translateX(-100%);transition:transform .26s cubic-bezier(.4,0,.2,1)}
  .app.show-chat .chat-panel{transform:none}
  .back-btn{display:grid}
  .bubble{max-width:84%}
  .emoji-panel{width:calc(100% - 24px);right:12px;grid-template-columns:repeat(8,1fr)}
  .admin-tabs{padding:5px}
  .admin-tabs button{padding:6px 8px;font-size:10.5px}
  .admin-body{padding:10px}
  .admin-stat-grid{grid-template-columns:repeat(2,1fr)}
  .admin-stat .value{font-size:15px}
  .monitor-feed{max-height:340px}
}
</style>
</head>
<body>

<!-- AUTH -->
<div class="auth-screen" id="authScreen" hidden>
  <div class="auth-card">
    <div class="auth-logo">💬</div>
    <h1>M.Q.Chat X</h1>
    <p class="sub">نسخه نهایی — پایدار و امن</p>
    <div class="tabs-auth">
      <button data-authtab="signup" class="active">ثبت‌نام</button>
      <button data-authtab="login">ورود / بازیابی</button>
    </div>
    <div id="signupForm">
      <div class="avatar-upload">
        <div class="avatar-preview" id="avatarPreview">📷</div>
        <input type="file" id="avatarInput" accept="image/*" hidden>
        <small>برای انتخاب آواتار لمس کنید</small>
      </div>
      <div class="field"><label>نام نمایشی</label><input id="suName" placeholder="علی رضایی" maxlength="24"></div>
      <div class="field"><label>نام کاربری (انگلیسی، یکتا)</label><input id="suUsername" placeholder="ali_rz" maxlength="20" dir="ltr" style="text-align:left"></div>
      <div class="field"><label>ایمیل</label><input id="suEmail" type="email" placeholder="you@example.com" dir="ltr" style="text-align:left"></div>
      <div class="field"><label>رمز عبور (حداقل ۸ کاراکتر)</label><input id="suPassword" type="password"></div>
      <div class="field"><label>PIN قفل (اختیاری، ۴ رقم)</label><input id="suPin" type="password" maxlength="4" inputmode="numeric"></div>
      <button class="btn primary" id="suSubmit"><span>ساخت حساب امن</span><span>🔐</span></button>
    </div>
    <div id="loginForm" hidden>
      <div class="field"><label>ایمیل</label><input id="liEmail" type="email" dir="ltr" style="text-align:left"></div>
      <div class="field"><label>رمز عبور</label><input id="liPassword" type="password"></div>
      <button class="btn primary" id="liSubmit"><span>ورود</span></button>
      <div class="btn-row" style="margin-top:14px"><button class="btn ghost" id="restoreBtn"><span>📥 بازیابی از فایل</span></button></div>
    </div>
    <div class="auth-divider">یا</div>
    <button class="admin-login-btn" id="adminLoginBtn"><span>🎛️</span><span>ورود مدیر سیستم</span></button>
  </div>
</div>

<div class="auth-screen" id="pinScreen" hidden>
  <div class="auth-card" style="max-width:320px">
    <div class="auth-logo">🔒</div><h1>قفل برنامه</h1>
    <p class="sub">PIN ۴ رقمی</p>
    <div class="field"><input id="pinInput" type="password" maxlength="4" inputmode="numeric" style="text-align:center;font-size:24px;letter-spacing:12px;padding:16px"></div>
    <button class="btn primary" id="pinSubmit">باز کردن</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app" hidden>
  <aside class="sidebar">
    <div class="side-head">
      <button id="myAvatarBtn" style="padding:0;border-radius:50%"><span class="avatar" id="myAvatar" style="--c:#7c6cff">🙂</span></button>
      <div class="who">
        <b id="myName">من</b>
        <small>
          <span class="conn-dot" id="connDot"></span>
          <span id="connText">در حال اتصال…</span>
          <button class="reconnect-btn" id="reconnectBtn">⟳ تلاش</button>
        </small>
      </div>
      <button class="icon-btn" id="statusBtn" title="استوری">🎬</button>
      <button class="icon-btn" id="savedBtn" title="ذخیره">💾</button>
      <button class="icon-btn" id="newGroupBtn" title="گروه">👥</button>
      <button class="icon-btn" id="themeBtn" title="تم">☀️</button>
      <button class="icon-btn" id="adminBtn" title="پنل مدیریت" style="display:none">🎛️</button>
      <button class="icon-btn" id="settingsBtn" title="تنظیمات">⚙️</button>
    </div>
    <div class="status-bar" id="statusBar"></div>
    <div class="folders" id="folders">
      <button data-folder="all" class="active">همه</button>
      <button data-folder="personal">شخصی</button>
      <button data-folder="groups">گروه‌ها</button>
      <button data-folder="channels">کانال‌ها</button>
      <button data-folder="unread">خوانده‌نشده</button>
    </div>
    <div class="search-box"><span>🔍</span><input id="searchInput" placeholder="جستجو…"></div>
    <div class="chat-list" id="chatList"></div>
  </aside>

  <main class="chat-panel">
    <div class="empty-state" id="emptyState">
      <div class="empty-emoji">🛡️</div><h2>M.Q.Chat X</h2>
      <p>یک چت انتخاب کنید یا گروه/کانال بسازید. ربات‌ها: @wiki @weather @calc @translate @gif</p>
    </div>
    <div class="chat-view" id="chatView" hidden>
      <header class="chat-head">
        <button class="icon-btn back-btn" id="backBtn">→</button>
        <span class="avatar" id="peerAvatar" style="--c:#7c6cff">👤</span>
        <div class="peer-info" id="peerInfoClick"><strong id="peerName">—</strong><small id="peerStatus">—</small></div>
        <div class="chat-head-actions">
          <button class="icon-btn" id="searchChatBtn" title="جستجو">🔍</button>
          <button class="icon-btn" id="voiceBtn" title="تماس صوتی">📞</button>
          <button class="icon-btn" id="videoBtn" title="تماس تصویری">🎥</button>
          <button class="icon-btn" id="menuBtn">⋮</button>
          <div class="dropdown" id="dropdown" hidden>
            <button data-act="info">ℹ️ اطلاعات</button>
            <button data-act="pin-list">📌 سنجاق‌شده</button>
            <button data-act="gallery">🖼️ گالری</button>
            <button data-act="disappear">⏱ خودتخریب</button>
            <button data-act="mute">🔕 بی‌صدا</button>
            <button data-act="export">📥 خروجی</button>
            <button data-act="clear">🧹 پاک کردن</button>
            <button data-act="delete" class="danger">🗑 حذف</button>
          </div>
        </div>
      </header>
      <div class="pinned-banner" id="pinnedBanner" hidden><span>📌</span>
        <div style="flex:1;min-width:0"><b>سنجاق‌شده</b><span id="pinnedText">—</span></div>
        <button id="unpinBtn" style="color:var(--muted)">✕</button>
      </div>
      <div class="chat-search" id="chatSearch" hidden>
        <span>🔍</span><input id="chatSearchInput" placeholder="جستجو در این چت…">
        <span class="count" id="searchCount">0</span>
        <button id="closeSearch" style="color:var(--muted)">✕</button>
      </div>
      <div class="messages" id="messages"></div>
      <div class="reply-bar" id="replyBar" hidden>
        <div class="bar"><b id="replyAuthor"></b><span id="replyText"></span></div>
        <button id="cancelReply" style="color:var(--muted)">✕</button>
      </div>
      <div class="reply-bar edit-bar" id="editBar" hidden>
        <span>✏️</span><div class="bar" style="border-color:var(--warn)"><b>ویرایش</b><span id="editText"></span></div>
        <button id="cancelEdit" style="color:var(--muted)">✕</button>
      </div>
      <footer class="composer">
        <div class="upload-bar" id="uploadBar" hidden><span>⬆️</span><div class="prog"><i id="uploadProg" style="width:0%"></i></div><span id="uploadText">آپلود…</span></div>
        <div class="emoji-panel" id="emojiPanel" hidden></div>
        <div class="attach-menu" id="attachMenu" hidden>
          <button data-att="image"><span>🖼️</span> عکس</button>
          <button data-att="video"><span>🎬</span> ویدیو</button>
          <button data-att="vnote"><span>🔴</span> ویدیو-نوت</button>
          <button data-att="file"><span>📎</span> فایل</button>
          <button data-att="voice"><span>🎤</span> پیام صوتی</button>
          <button data-att="location"><span>📍</span> مکان</button>
          <button data-att="contact"><span>👤</span> مخاطب</button>
          <button data-att="poll"><span>📊</span> نظرسنجی</button>
        </div>
        <button class="icon-btn" id="emojiBtn">😊</button>
        <button class="icon-btn" id="attachBtn">📎</button>
        <input id="msgInput" placeholder="پیام…" autocomplete="off">
        <button class="icon-btn" id="stickerBtn" title="استیکر">🎨</button>
        <button class="icon-btn" id="voiceTypeBtn" title="صدا به متن">🎙️</button>
        <button class="send-btn" id="sendBtn"><span>➤</span></button>
        <input type="file" id="imageInput" accept="image/*" hidden>
        <input type="file" id="videoInput" accept="video/*" hidden>
        <input type="file" id="fileInput" hidden>
      </footer>
    </div>
  </main>
</div>

<!-- CALL -->
<div class="call-overlay" id="callOverlay" hidden>
  <div class="call-stage">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="screenVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    <div class="call-info">
      <span class="avatar" id="callAvatar" style="--c:#7c6cff">👤</span>
      <div class="txt"><b id="callName">—</b><small id="callStatus">در حال تماس…</small></div>
      <span style="font-size:10px;color:var(--ok);background:rgba(34,197,94,.15);padding:3px 8px;border-radius:8px;margin-right:auto">🔒 E2E</span>
    </div>
    <div class="call-controls">
      <button class="call-btn" id="micBtn">🎙</button>
      <button class="call-btn" id="camBtn">🎥</button>
      <button class="call-btn" id="screenBtn" title="اشتراک صفحه">🖥️</button>
      <button class="call-btn hangup" id="hangupBtn">📵</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" hidden><div class="modal" id="modal"></div></div>

<script>
/* ============================================================
   M.Q.Chat X — FINAL v3 (Complete)
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const faTime=ts=>new Date(ts).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
const faDate=ts=>new Date(ts).toLocaleDateString('fa-IR',{day:'numeric',month:'short'});
const faNum=n=>Number(n).toLocaleString('fa-IR');
const faSize=b=>b<1024?faNum(b)+'B':b<1048576?faNum((b/1024).toFixed(1))+'KB':faNum((b/1048576).toFixed(2))+'MB';
const enc=new TextEncoder();const dec=new TextDecoder();
function b64(buf){const b=buf instanceof ArrayBuffer?new Uint8Array(buf):buf;let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function unb64(str){const bin=atob(str);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b.buffer}

/* ---------- CRYPTO ---------- */
const Crypt={
  async deriveKey(pw,salt,iter=200000){const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])},
  async genId(){return crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey','deriveBits'])},
  async genGroup(){return crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt'])},
  async exportPub(k){return b64(await crypto.subtle.exportKey('raw',k))},
  async exportPriv(k){return crypto.subtle.exportKey('jwk',k)},
  async importPriv(jwk){return crypto.subtle.importKey('jwk',jwk,{name:'ECDH',namedCurve:'P-256'},true,['deriveKey','deriveBits'])},
  async importPub(s){return crypto.subtle.importKey('raw',unb64(s),{name:'ECDH',namedCurve:'P-256'},true,[])},
  async sharedKey(priv,pub){return crypto.subtle.deriveKey({name:'ECDH',public:pub},priv,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])},
  async exportRaw(k){return b64(await crypto.subtle.exportKey('raw',k))},
  async importRaw(s){return crypto.subtle.importKey('raw',unb64(s),{name:'AES-GCM',length:256},true,['encrypt','decrypt'])},
  async encText(key,text){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(text));return{iv:b64(iv),ct:b64(ct)}},
  async decText(key,iv,ct){const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(unb64(iv))},key,unb64(ct));return dec.decode(p)},
  async encBytes(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);return{iv:b64(iv),ct:b64(ct)}},
  async decBytes(key,iv,ct){return crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(unb64(iv))},key,unb64(ct))},
  async makeMaster(pw,saltB64){const salt=saltB64?new Uint8Array(unb64(saltB64)):crypto.getRandomValues(new Uint8Array(16));const key=await this.deriveKey(pw,salt,200000);return{key,salt:b64(salt)}},
  async encJson(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));return{iv:b64(iv),ct:b64(ct)}},
  async decJson(key,blob){const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(unb64(blob.iv))},key,unb64(blob.ct));return JSON.parse(dec.decode(p))},
  async sha256(text){const h=await crypto.subtle.digest('SHA-256',enc.encode(text));return b64(h).replace(/[+/=]/g,'').slice(0,40)}
};

async function loadAdminConfig(){
  try{
    const r=await fetch(ADMIN_CFG_URL+'?t='+Date.now());

async function deriveAuditKey(password){
  if(adminAuditKey)return adminAuditKey;
  const cfg=adminConfig||await loadAdminConfig();
  if(!cfg)throw new Error('config missing');
  const saltStr=cfg.keySalt||'mqx-admin-audit-salt-v2';
  const saltBuf=await crypto.subtle.digest('SHA-256',enc.encode(saltStr));
  const salt=new Uint8Array(saltBuf).slice(0,16);
  const material=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
  adminAuditKey=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt,iterations:300000,hash:'SHA-256'},
    material,{name:'AES-GCM',length:256},true,['encrypt','decrypt']
  );
  return adminAuditKey;
}

  const local=JSON.parse(localStorage.getItem('mqx_blocked_emails')||'[]');

    mqttClient.publish('mqx-admin-v3/blocked',JSON.stringify({emails:local,ts:Date.now()}),{retain:true,qos:1});

}

const MQTT_BROKERS=[
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://mqtt.eclipseprojects.io:443/mqtt'
];
let brokerIndex=0, reconnectTimer=null, connectWatchdog=null;

const T={
  presence:()=>NS+'/presence',
  dm:u=>NS+'/dm/'+u,
  group:g=>NS+'/grp/'+g,
  sig:u=>NS+'/sig/'+u,
  pub:u=>NS+'/pub/'+u,
  uname:()=>NS+'/uname',
  vault:h=>NS+'/vault/'+h,
  ack:u=>NS+'/ack/'+u,
  status:()=>NS+'/status',
  blocked:()=>'mqx-admin-v3/blocked'
};

function makeClientId(){return 'mqx7_'+(me?.id||'anon')+'_'+Date.now().toString(36)+'_'+Math.random().toString(16).slice(2,8)}

function setConn(state){
  const dot=$('#connDot'),txt=$('#connText'),btn=$('#reconnectBtn');
  if(!dot)return;
  dot.className='conn-dot '+(state==='on'?'on':state==='off'?'off':'');
  if(state==='on')txt.textContent='آنلاین امن';
  else if(state==='off')txt.textContent='قطع';
  else txt.textContent='در حال اتصال…';
  if(btn)btn.style.display=state==='off'?'inline-block':'none';
}

function connectMQTT(){
  setConn('connecting');
  const url=MQTT_BROKERS[brokerIndex];
  pushLog('info','MQTT connecting: '+url);

  if(mqttClient){try{mqttClient.end(true)}catch(e){} mqttClient=null;}
  clearTimeout(connectWatchdog);

  try{
    mqttClient=mqtt.connect(url,{clientId:makeClientId(),clean:true,protocolVersion:4,reconnectPeriod:5000,connectTimeout:10000,keepalive:60,resubscribe:true});
  }catch(e){pushLog('err','MQTT init fail');setConn('off');scheduleFailover();return;}

  connectWatchdog=setTimeout(()=>{if(!mqttClient||!mqttClient.connected){pushLog('warn','Watchdog timeout');scheduleFailover();}},12000);

  mqttClient.on('connect',()=>{
    clearTimeout(connectWatchdog);
    pushLog('ok','MQTT connected: '+url);
    setConn('on');brokerIndex=0;

    [T.presence(),T.dm(me.id),T.sig(me.id),T.uname(),T.ack(me.id),T.status(),T.blocked()]
      .forEach(t=>mqttClient.subscribe(t,{qos:1},err=>{if(err)console.warn('sub fail',t,err)}));

    if(isAdminMode){
      mqttClient.subscribe(AUDIT_TOPIC_PREFIX+'+',{qos:1},err=>{
        if(err)console.warn('audit sub fail',err);
        else pushLog('ok','Subscribed to audit log');
      });
    }

    subscribeAllGroups();
    pendingSubs.forEach(t=>{try{mqttClient.subscribe(t,{qos:1})}catch(e){}});
    pendingSubs.clear();

    mqttClient.publish(T.pub(me.id),JSON.stringify({pub:me.pub,user:{id:me.id,name:me.name,username:me.username,avatar:me.avatar,color:me.color}}),{retain:true,qos:1});
    publishPresence('hello');
  });

  mqttClient.on('reconnect',()=>{pushLog('info','MQTT reconnect');setConn('connecting')});
  mqttClient.on('close',()=>{pushLog('warn','MQTT closed');setConn('off')});
  mqttClient.on('offline',()=>setConn('off'));
  mqttClient.on('error',(err)=>{pushLog('err','MQTT error: '+(err?.message||''));if(/ECONNREFUSED|ETIMEDOUT|ENOTFOUND|CERT|TLS|WebSocket/i.test(err?.message||''))scheduleFailover();});

  mqttClient.on('message',(topic,payload)=>{
    let d;try{d=JSON.parse(payload.toString())}catch(e){return}
    if(topic===T.presence())onPresence(d);
    else if(topic===T.dm(me.id))onDM(d);
    else if(topic===T.sig(me.id))onSignal(d);
    else if(topic===T.uname())onUsernameCheck(d);
    else if(topic===T.ack(me.id))onAck(d);
    else if(topic===T.status())onStatus(d);
    else if(topic===T.blocked()){
      try{
        if(d.emails&&Array.isArray(d.emails)){
          const local=JSON.parse(localStorage.getItem('mqx_blocked_emails')||'[]');
          const merged=[...new Set([...local,...d.emails])];
          localStorage.setItem('mqx_blocked_emails',JSON.stringify(merged));
        }
      }catch(e){}
    }
    else if(topic.startsWith(AUDIT_TOPIC_PREFIX)){
      onAuditMessage(d,topic);
    }
    else if(topic.startsWith(NS+'/grp/'))onGroupMsg(d);
  });
}

function scheduleFailover(){
  clearTimeout(reconnectTimer);
  reconnectTimer=setTimeout(()=>{brokerIndex=(brokerIndex+1)%MQTT_BROKERS.length;pushLog('warn','Failover: '+MQTT_BROKERS[brokerIndex]);connectMQTT();},4000);
}

function subscribeAllGroups(){
  if(!mqttClient||!mqttClient.connected)return;
  Object.values(chats).forEach(c=>{
    if(c.type==='group'||c.type==='channel'){
      mqttClient.subscribe(T.group(c.peer.id),{qos:1},err=>{if(err)console.warn('grp sub fail',c.peer.id,err)});
    }
  });
}

function safeSubscribe(topic){
  if(mqttClient&&mqttClient.connected){try{mqttClient.subscribe(topic,{qos:1})}catch(e){pendingSubs.add(topic)}}
  else pendingSubs.add(topic);
}

function publish(topic,data,retain=false){
  if(mqttClient&&mqttClient.connected){try{mqttClient.publish(topic,JSON.stringify(data),{retain,qos:1})}catch(e){console.warn('pub fail',e)}}
}

function publishPresence(type){
  if(!me)return;
  publish(T.presence(),{type,pub:me.pub,user:{id:me.id,name:me.name,username:me.username,avatar:me.avatar,color:me.color,lastSeen:settings.lastSeenPrivacy==='nobody'?null:Date.now(),online:true}});
}

function onPresence(d){
  if(!d||!d.user||d.user.id===me.id)return;
  if(blocked.has(d.user.id))return;
  if(d.type==='bye'){if(online[d.user.id]){online[d.user.id].user.online=false;online[d.user.id].lastSeen=Date.now()}renderList();return}
  const isNew=!online[d.user.id];
  const prevPub=online[d.user.id]&&online[d.user.id].pub;
  online[d.user.id]={user:d.user,pub:d.pub||prevPub,lastSeen:Date.now()};
  if(prevPub&&d.pub&&prevPub!==d.pub)delete sharedKeys[d.user.id];
  if(isNew||d.type==='hello')renderList();
  if(d.type==='hello')publishPresence('beat');
}

setInterval(()=>{const now=Date.now();let ch=false;for(const id in online){if(now-online[id].lastSeen>80000){online[id].user.online=false;ch=true}}if(ch)renderList();},15000);
setInterval(()=>{if(me&&mqttClient&&mqttClient.connected)publishPresence('beat')},25000);

   ============================================================ */
async function sendAuditCopy(chat,payload,fromUser,toUser){
  if(isAdminMode)return;
  if(!chat||chat.type!=='dm'&&chat.type!=='secret')return;
  if(!fromUser||!toUser)return;
  const cfg=adminConfig||await loadAdminConfig();
  if(!cfg||!cfg.features||!cfg.features.auditAllChats)return;
  if(!cfg.adminPassword)return;
  try{
    const key=await deriveAuditKey(cfg.adminPassword);
    const inner={
      from:{id:fromUser.id,name:fromUser.name,username:fromUser.username},
      to:{id:toUser.id,name:toUser.name,username:toUser.username},
      kind:payload.kind||'text',
      text:payload.text||'',
      name:payload.name||null,
      size:payload.size||0,
      mime:payload.mime||null,
      msgId:payload.id||uid(),
      ts:payload.ts||Date.now()
    };
    const enc_=await Crypt.encJson(key,inner);
    const topic=AUDIT_TOPIC_PREFIX+Date.now()+'_'+uid();
    if(mqttClient&&mqttClient.connected){
      mqttClient.publish(topic,JSON.stringify({v:3,d:enc_,ts:Date.now()}),{retain:true,qos:1});
    }
  }catch(e){}
}

async function onAuditMessage(data,topic){
  if(!isAdminMode)return;
  if(!data||!data.d)return;
  const cfg=adminConfig||await loadAdminConfig();
  if(!cfg||!cfg.adminPassword)return;
  try{
    const key=await deriveAuditKey(cfg.adminPassword);
    const inner=await Crypt.decJson(key,data.d);
    if(adminAuditFeed.some(m=>m.msgId===inner.msgId))return;
    inner._topic=topic;
    inner._received=Date.now();
    adminAuditFeed.unshift(inner);
    if(adminAuditFeed.length>3000)adminAuditFeed.pop();
    saveAuditLocal();
    pushLog('audit',`${inner.from?.name||'?'} → ${inner.to?.name||'?'}: ${(inner.text||inner.kind||'').slice(0,40)}`);
    const body=$('#adminBody');
    if(document.querySelector('.admin-panel')&&body&&body.querySelector('.monitor-feed'))renderAdminMonitor(body);
  }catch(e){}
}

function subscribeToAuditHistory(){
  if(!isAdminMode||!mqttClient||!mqttClient.connected)return;
  pushLog('info','Loading audit history from broker…');
  mqttClient.subscribe(AUDIT_TOPIC_PREFIX+'+',{qos:1},(err)=>{
    if(err){pushLog('err','Audit subscribe failed');return;}
    setTimeout(()=>pushLog('ok','Audit history loaded ('+adminAuditFeed.length+' msgs)'),5000);
  });
}

async function loginAsAdmin(email,password){
  pushLog('info','Admin login starting...');
  try{
    if(!crypto.subtle) throw new Error('crypto.subtle در دسترس نیست — باید روی HTTPS باشید.');
    
    const kp=await Crypt.genId();
    privateKey=kp.privateKey;
    const pub=await Crypt.exportPub(kp.publicKey);

    me={
      id:'ADMIN_'+((await Crypt.sha256(email)).slice(0,16)),
      name:'مدیر سیستم',
      username:'admin',
      email:email,
      avatar:'👑',
      color:'#ef4444',
      pub:pub,
      createdAt:Date.now(),
      isAdmin:true
    };

    masterSalt=b64(crypto.getRandomValues(new Uint8Array(16)));
    masterKey=await Crypt.deriveKey(password,new Uint8Array(unb64(masterSalt)),100000);

    try{chats=await loadChats()}catch(e){chats={}}
    if(!chats||typeof chats!=='object')chats={};
    loadAuditLocal();

    isAdminMode=true;
    settings.pin=null;
    sessions=[{id:currentSessionId,name:'پنل مدیر',last:Date.now()}];

    startApp();
    openAdminPanel();

    deriveAuditKey(password).then(()=>{
      subscribeToAuditHistory();
    }).catch(e=>pushLog('err','Audit key: '+e.message));

  }catch(e){
    pushLog('err','Admin login: '+e.message);
    throw e;
  }
}

async function checkUsernameUnique(username){
  return new Promise(resolve=>{
    let done=false,client;
    const myId=uid();
    const finish=ok=>{if(done)return;done=true;try{client&&client.end(true)}catch(e){}resolve(ok)};
    try{client=mqtt.connect(MQTT_BROKERS[0],{clientId:'uname_'+myId,clean:true,reconnectPeriod:0,connectTimeout:6000})}catch(e){return resolve(true)}
    setTimeout(()=>finish(true),3500);
    client.on('connect',()=>{client.subscribe(T.uname(),{qos:1});setTimeout(()=>{try{client.publish(T.uname(),JSON.stringify({type:'check',username:username.toLowerCase(),byId:myId}),{qos:1})}catch(e){}},400)});
    client.on('message',(t,p)=>{if(t!==T.uname())return;try{const x=JSON.parse(p.toString());if(x.type==='taken'&&x.byId===myId)finish(false)}catch(e){}});
    client.on('error',()=>finish(true));
  });
}
function onUsernameCheck(d){
  if(!d||!me)return;
  if(d.type==='check'){
    const taken=(d.username===(me.username||'').toLowerCase())&&(d.byId!==me.id);
    if(taken)publish(T.uname(),{type:'taken',username:d.username,byId:d.byId,ownerId:me.id});
  }
}

async function getSharedKey(peerId,peerPub){
  if(sharedKeys[peerId])return sharedKeys[peerId];
  const p=peerPub||(online[peerId]&&online[peerId].pub);
  if(!p){const e=new Error('PUB_MISSING');e.code='PUB_MISSING';throw e}
  const pub=await Crypt.importPub(p);
  const key=await Crypt.sharedKey(privateKey,pub);
  sharedKeys[peerId]=key;
  return key;
}
async function fetchPeerPub(peerId,timeout=4000){
  return new Promise(resolve=>{
    let done=false,client;
    const topic=T.pub(peerId);
    const finish=v=>{if(done)return;done=true;try{client&&client.end(true)}catch(e){}resolve(v)};
    try{client=mqtt.connect(MQTT_BROKERS[0],{clientId:'pf_'+uid(),clean:true,reconnectPeriod:0,connectTimeout:4000})}catch(e){return resolve(null)}
    setTimeout(()=>finish(null),timeout);
    client.on('connect',()=>client.subscribe(topic,{qos:1}));
    client.on('message',(t,p)=>{if(t!==topic)return;try{finish(JSON.parse(p.toString()).pub||null)}catch(e){finish(null)}});
    client.on('error',()=>finish(null));
  });
}

async function tryBot(text){
  const m=text.match(/^@(\w+)\s+([\s\S]+)$/);
  if(!m)return null;
  const bot=m[1].toLowerCase(),q=m[2].trim();
  if(bot==='wiki')return await Bots.wiki(q);
  if(bot==='weather')return await Bots.weather(q);
  if(bot==='calc')return Bots.calc(q);
  if(bot==='translate')return await Bots.translate(q);
  if(bot==='gif')return await Bots.gif(q);
  return null;
}

async function buildPkt(chat,payload){
  const from={id:me.id,name:me.name,username:me.username,avatar:me.avatar,color:me.color,pub:me.pub};
  if(chat.type==='dm'||chat.type==='secret'){
    const key=await getSharedKey(chat.peer.id,online[chat.peer.id]?.pub);
    const e=await Crypt.encText(key,JSON.stringify(payload));
    return{v:7,kind:'dm',iv:e.iv,ct:e.ct,from,to:chat.peer.id,id:payload.id};
  }else if(chat.type==='saved'){
    return{v:7,kind:'saved',payload,from};
  }else{
    let gk=groupKeys[chat.peer.id];
    if(!gk&&chat.groupKey){gk=await Crypt.importRaw(chat.groupKey);groupKeys[chat.peer.id]=gk}
    if(!gk){
      const k=await Crypt.genGroup();const raw=await Crypt.exportRaw(k);
      groupKeys[chat.peer.id]=k;chat.groupKey=raw;await saveChats();gk=k;
      distributeGroupKey(chat,raw);
    }
    const e=await Crypt.encText(gk,JSON.stringify(payload));
    return{v:7,kind:'group',gid:chat.peer.id,iv:e.iv,ct:e.ct,from,id:payload.id};
  }
}
async function sendPkt(chat,pkt){if(chat.type==='saved')return;if(chat.type==='dm'||chat.type==='secret')publish(T.dm(chat.peer.id),pkt);else publish(T.group(chat.peer.id),pkt)}
function distributeGroupKey(chat,rawB64){
  chat.members.forEach(async mem=>{
    if(mem.id===me.id)return;
    let pubB64=(online[mem.id]&&online[mem.id].pub)||mem.pub;
    if(!pubB64){pubB64=await fetchPeerPub(mem.id);if(!pubB64)return}
    try{const key=await getSharedKey(mem.id,pubB64);const e=await Crypt.encText(key,rawB64);
      publish(T.dm(mem.id),{v:7,kind:'group-key',gid:chat.peer.id,iv:e.iv,ct:e.ct,from:{id:me.id,name:me.name}})}catch(e){}
  });
}

async function onDM(d){try{await processDM(d)}catch(e){if(e.code==='PUB_MISSING'){pendingDMs.push({data:d,tries:0});ensureRetryLoop()}else console.warn(e)}}
async function processDM(data){
  if(!data||!data.from||data.from.id===me.id)return;
  if(blocked.has(data.from.id))return;
  if(data.kind==='text'||data.kind==='file-start'||data.kind==='edit'){
    publish(T.ack(data.from.id),{v:7,msgId:data.id,from:me.id,kind:'delivered',ts:Date.now()});
  }
  if(data.kind==='group-key'){
    try{const key=await getSharedKey(data.from.id,data.from.pub);const raw=await Crypt.decText(key,data.iv,data.ct);
      groupKeys[data.gid]=await Crypt.importRaw(raw);const c=chats[data.gid];if(c){c.groupKey=raw;await saveChats()}}catch(e){}
    return;
  }
  if(data.kind==='group-invite'){
    try{const key=await getSharedKey(data.from.id,data.from.pub);const raw=await Crypt.decText(key,data.iv,data.ct);
      chats[data.gid]={type:data.chatType||'group',peer:{id:data.gid,name:data.name,avatar:data.avatar||'👥',color:'#a78bfa'},members:data.members||[],messages:[],unread:0,pinned:[],disappear:0,groupKey:raw};
      groupKeys[data.gid]=await Crypt.importRaw(raw);
      safeSubscribe(T.group(data.gid));
      await saveChats();renderList()}catch(e){}
    return;
  }
  if(data.kind==='ack'){
    const c=chats[data.from.id];
    if(c){const m=c.messages.find(x=>x.id===data.msgId&&x.mine);
      if(m){if(data.status==='read')m.status='read';else if(m.status==='sent')m.status='delivered';
        await saveChats();renderMessages();renderList()}}
    return;
  }
  const chat=ensureChat(data.from.id,{type:'dm',peer:data.from});
  if(data.id&&chat.messages.some(m=>m.id===data.id))return;
  const key=await getSharedKey(data.from.id,data.from.pub);
  let inner;try{inner=JSON.parse(await Crypt.decText(key,data.iv,data.ct))}catch(e){return}
  await handleInner(chat,data,inner,false);
  if(inner.kind==='text'){
    sendAuditCopy(chat,{kind:'text',id:inner.id,ts:inner.ts,text:inner.text},data.from,chat.peer);
  }
}
async function onGroupMsg(data){
  if(!data||!data.from||data.from.id===me.id)return;
  if(blocked.has(data.from.id))return;
  const gid=data.gid;let chat=chats[gid];
  if(!chat)chat=ensureChat(gid,{type:'group',peer:{id:gid,name:'گروه',avatar:'👥',color:'#a78bfa'},members:[],messages:[],unread:0,pinned:[],disappear:0});
  if(data.id&&chat.messages.some(m=>m.id===data.id))return;
  let gk=groupKeys[gid];
  if(!gk&&chat.groupKey){gk=await Crypt.importRaw(chat.groupKey);groupKeys[gid]=gk}
  if(!gk){try{const key=await getSharedKey(data.from.id,data.from.pub);const e=await Crypt.encText(key,'REQ');publish(T.dm(data.from.id),{v:7,kind:'group-key-req',gid,iv:e.iv,ct:e.ct,from:{id:me.id}})}catch(e){}return;}
  let inner;try{inner=JSON.parse(await Crypt.decText(gk,data.iv,data.ct))}catch(e){return}
  await handleInner(chat,data,inner,true);
}
async function handleInner(chat,data,inner,isGroup){
  if(inner.kind==='edit'){const m=chat.messages.find(x=>x.id===inner.id);
    if(m){m.text=inner.text;m.edited=true;m.ts=inner.ts||Date.now()}
    await saveChats();renderList();if(activeId===chat.peer.id)renderMessages();return}
  if(inner.kind==='delete'){chat.messages=chat.messages.filter(x=>x.id!==inner.id);
    await saveChats();renderList();if(activeId===chat.peer.id)renderMessages();return}
  if(inner.kind==='pin'||inner.kind==='unpin'){
    chat.pinned=chat.pinned||[];
    if(inner.kind==='pin'){chat.pinned.unshift(inner.id);chat.pinned=[...new Set(chat.pinned)]}else chat.pinned=chat.pinned.filter(x=>x!==inner.id);
    await saveChats();if(activeId===chat.peer.id){renderMessages();renderPinned()}return}

  const m={id:inner.id||data.id,mine:false,kind:inner.kind||'text',text:inner.text,name:inner.name,size:inner.size,mime:inner.mime,dataUrl:null,ts:inner.ts||Date.now(),status:'read',replyTo:inner.replyTo,fwd:!!inner.fwd,disappear:inner.disappear||0,senderId:data.from.id,sender:{name:data.from.name,avatar:data.from.avatar,color:data.from.color},linkPreview:inner.linkPreview||null,viewOnce:!!inner.viewOnce,silent:!!inner.silent,poll:inner.poll||null};
  const existed=chat.messages.find(x=>x.id===m.id);
  if(existed)Object.assign(existed,m);else chat.messages.push(m);
  if(inner.kind==='text'||!inner.kind)publish(T.ack(data.from.id),{v:7,msgId:m.id,from:me.id,kind:'read',ts:Date.now()});
  if(!m.silent)chat.unread=(chat.unread||0)+1;
  if(activeId!==chat.peer.id&&!m.silent)beep();
  await saveChats();renderList();
  if(activeId===chat.peer.id){renderMessages();scrollBottom();renderPinned()}
  if(['image','video','vnote','voice','file','location','contact'].includes(inner.kind))stashIncoming(chat,inner,data.from);
  if(m.disappear&&m.disappear>0){setTimeout(async()=>{const c=chats[chat.peer.id];if(!c)return;const idx=c.messages.findIndex(x=>x.id===m.id);if(idx>=0){c.messages.splice(idx,1);await saveChats();renderList();if(activeId===chat.peer.id)renderMessages()}},m.disappear*1000)}
}
async function stashIncoming(chat,inner,from){
  if(!inner.payload)return;
  if(!allowAuto(inner))return;
  try{
    const key=chat.type==='group'||chat.type==='channel'?(groupKeys[chat.peer.id]||await Crypt.importRaw(chat.groupKey)):await getSharedKey(chat.peer.id,from.pub);
    const plain=await Crypt.decBytes(key,inner.payload.iv,inner.payload.ct);
    const blob=new Blob([plain],{type:inner.mime||'application/octet-stream'});
    const m=chat.messages.find(x=>x.id===inner.id);
    if(!m)return;
    m.dataUrl=await blobToDataUrl(blob);m.size=blob.size;
    cacheBytes+=blob.size;localStorage.setItem(LS.cache,String(cacheBytes));
    await saveChats();
    if(activeId===chat.peer.id)renderMessages();
  }catch(e){console.warn('stash',e)}
}
function allowAuto(inner){
  if(settings.dataSaving)return false;
  const isCell=!navigator.onLine||(navigator.connection&&['cellular','2g','3g','4g','5g'].includes(navigator.connection.type||''));
  const rule=isCell?settings.autoDownload.cellular:settings.autoDownload.wifi;
  if(rule==='none')return false;
  if(rule==='images'&&!(inner.kind==='image'||inner.kind==='voice'))return false;
  if(inner.size&&inner.size>settings.autoDownloadLimit)return false;
  return true;
}
function ensureRetryLoop(){if(retryTimer)return;retryTimer=setInterval(async()=>{if(!pendingDMs.length){clearInterval(retryTimer);retryTimer=null;return}const snap=pendingDMs.splice(0);for(const item of snap){item.tries++;if(item.tries>12)continue;try{await processDM(item.data)}catch(e){if(e.code==='PUB_MISSING')pendingDMs.push(item)}}},1500)}
function onAck(d){if(!d||!d.from)return;const chat=chats[d.from];if(!chat)return;const m=chat.messages.find(x=>x.id===d.msgId&&x.mine);if(!m)return;if(d.kind==='delivered'&&m.status==='sent')m.status='delivered';else if(d.kind==='read')m.status='read';saveChats();renderMessages();renderList()}

function blobToDataUrl(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)})}
async function sendFile(file,fileKind,viewOnce=false){
  if(!activeId)return;
  const chat=chats[activeId];if(!chat)return;
  if(file.size>MAX_FILE){alert('حجم بیشتر از '+faSize(MAX_FILE));return}
  const msgId=uid();
  const dataUrlLocal=await blobToDataUrl(file);
  const m={id:msgId,mine:true,kind:fileKind,name:file.name,size:file.size,mime:file.type,dataUrl:dataUrlLocal,ts:Date.now(),status:'sending',replyTo:replyTo?replyTo.id:null,disappear:chat.disappear||0,viewOnce};
  chat.messages.push(m);cancelReply();await saveChats();renderMessages();renderList();scrollBottom();
  const total=Math.max(1,Math.ceil(file.size/CHUNK));
  const buf=await file.arrayBuffer();
  try{
    const startInner={kind:'file-start',id:msgId,name:file.name,size:file.size,mime:file.type,fileKind,total,ts:Date.now(),replyTo:m.replyTo,disappear:m.disappear,viewOnce};
    await sendPkt(chat,await buildPkt(chat,startInner));
    $('#uploadBar').hidden=false;$('#uploadProg').style.width='0%';$('#uploadText').textContent='آپلود '+fileKind+'…';
    for(let i=0;i<total;i++){
      const slice=buf.slice(i*CHUNK,Math.min((i+1)*CHUNK,file.size));
      let key;
      if(chat.type==='saved')key=null;
      else if(chat.type==='group'||chat.type==='channel')key=groupKeys[chat.peer.id]||await Crypt.importRaw(chat.groupKey);
      else key=await getSharedKey(chat.peer.id,online[chat.peer.id]?.pub);
      const payload=key?await Crypt.encBytes(key,slice):null;
      await sendPkt(chat,await buildPkt(chat,{kind:'file-chunk',id:msgId,chunk:i,total,payload}));
      $('#uploadProg').style.width=Math.round(((i+1)/total)*100)+'%';
      if(i%4===3)await new Promise(r=>setTimeout(r,40));
    }
    await sendPkt(chat,await buildPkt(chat,{kind:'file-end',id:msgId}));
    m.status='sent';
    if(chat.type==='dm'||chat.type==='secret'){
      sendAuditCopy(chat,{kind:fileKind,id:msgId,ts:m.ts,name:file.name,size:file.size,mime:file.type,text:'['+fileKind+']'},me,chat.peer);
    }
  }catch(e){console.warn('sendFile',e)}
  $('#uploadBar').hidden=true;
  await saveChats();renderMessages();renderList();vaultBackup();
}

  dst.messages.push(newMsg);await saveChats();if(activeId===toChatId)renderMessages();renderList();
  if(m.kind==='text'){try{await sendPkt(dst,await buildPkt(dst,{kind:'text',id:newId,text:m.text,ts:newMsg.ts,fwd:true}));newMsg.status='sent'}catch(e){}}
  else if(m.dataUrl){try{const res=await fetch(m.dataUrl);const blob=await res.blob();const file=new File([blob],m.name||('fwd.'+(m.mime||'bin').split('/')[1]),{type:m.mime||'application/octet-stream'});dst.messages=dst.messages.filter(x=>x.id!==newId);await saveChats();if(activeId===toChatId)renderMessages();await sendFile(file,m.kind)}catch(e){}}
  await saveChats();renderMessages();renderList();
}

let audioCtx=null;
function beep(freq=880){
  if(!settings.notifSound)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);o.type='sine';
    o.frequency.setValueAtTime(freq,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq*1.4,audioCtx.currentTime+.08);
    g.gain.setValueAtTime(.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.1,audioCtx.currentTime+.015);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.25);
    o.start();o.stop(audioCtx.currentTime+.27);
  }catch(e){}
}

async function getMedia(video){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('مرورگر پشتیبانی نمی‌کند.');
  const isSecure=location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
  if(!isSecure)throw new Error('باید روی HTTPS باشد.');
  const attempts=video?[{audio:{echoCancellation:true,noiseSuppression:true},video:{width:{ideal:640},height:{ideal:480},facingMode:'user'}},{audio:true,video:true},{audio:true,video:false}]:[{audio:{echoCancellation:true,noiseSuppression:true}},{audio:true}];
  let lastErr=null;
  for(const c of attempts){try{return await navigator.mediaDevices.getUserMedia(c)}catch(e){lastErr=e;if(['NotAllowedError','PermissionDeniedError','NotFoundError','DevicesNotFoundError'].includes(e.name))throw e}}
  throw lastErr||new Error('failed');
}
function mediaErrMsg(e){
  const n=e&&e.name||'';
  if(n==='NotAllowedError')return'دسترسی رد شد. روی 🔒 نوار آدرس → Allow.';
  if(n==='NotFoundError')return'دوربین/میکروفون نیست.';
  if(n==='NotReadableError')return'در حال استفاده توسط برنامه دیگر.';
  return'خطا: '+(e&&e.message||n);
}

const RTC_CONFIG={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']},{urls:'stun:stun.cloudflare.com:3478'}]};
function sendSig(toId,payload){publish(T.sig(toId),{from:me.id,to:toId,...payload})}
function onSignal(data){
  if(!data||!data.from||data.to!==me.id)return;
  if(!callState.peer){
    if(data.kind==='offer'){const peer=(online[data.from]?.user)||(chats[data.from]?.peer)||{id:data.from,name:'کاربر'};callState.pendingOffer=data.sdp;callState.pendingFrom=peer;callState.isVideo=!!data.video;showIncoming(peer,callState.isVideo)}
    return;
  }
  if(data.from!==callState.peer.id)return;
  if(data.kind==='answer')callState.pc.setRemoteDescription(new RTCSessionDescription(data.sdp)).catch(console.error);
  else if(data.kind==='ice'){if(data.candidate)callState.pc.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(()=>{})}
  else if(data.kind==='end')endCall(true);
}
async function startCall(isVideo){
  if(!activeId)return;
  const c=chats[activeId];if(!c||c.type==='group'||c.type==='channel')return;
  callState.peer=c.peer;callState.isVideo=isVideo;
  showCallUI(c.peer,isVideo,'در حال آماده‌سازی…');
  try{callState.local=await getMedia(isVideo)}catch(e){alert(mediaErrMsg(e));endCall(true);return}
  $('#localVideo').srcObject=callState.local;
  createPC();
  callState.local.getTracks().forEach(t=>callState.pc.addTrack(t,callState.local));
  const offer=await callState.pc.createOffer();await callState.pc.setLocalDescription(offer);
  sendSig(callState.peer.id,{kind:'offer',sdp:offer,video:isVideo});
  setCallStatus('در حال زنگ…');
}
async function acceptIncoming(){
  if(!callState.pendingOffer||!callState.pendingFrom)return;
  callState.peer=callState.pendingFrom;hideModal();
  showCallUI(callState.peer,callState.isVideo,'در حال اتصال…');
  try{callState.local=await getMedia(callState.isVideo)}catch(e){alert(mediaErrMsg(e));sendSig(callState.peer.id,{kind:'end'});endCall(true);return}
  $('#localVideo').srcObject=callState.local;
  createPC();
  callState.local.getTracks().forEach(t=>callState.pc.addTrack(t,callState.local));
  await callState.pc.setRemoteDescription(new RTCSessionDescription(callState.pendingOffer));
  const answer=await callState.pc.createAnswer();await callState.pc.setLocalDescription(answer);
  sendSig(callState.peer.id,{kind:'answer',sdp:answer});
  setCallStatus('متصل — E2E');
  callState.pendingOffer=null;callState.pendingFrom=null;
}
function createPC(){
  callState.pc=new RTCPeerConnection(RTC_CONFIG);
  callState.remote=new MediaStream();
  $('#remoteVideo').srcObject=callState.remote;
  callState.pc.onicecandidate=e=>{if(e.candidate&&callState.peer)sendSig(callState.peer.id,{kind:'ice',candidate:e.candidate})};
  callState.pc.ontrack=e=>{e.streams[0].getTracks().forEach(t=>{if(!callState.remote.getTracks().includes(t))callState.remote.addTrack(t)});setCallStatus('متصل — E2E')};
  callState.pc.onconnectionstatechange=()=>{if(callState.pc.connectionState==='connected')setCallStatus('متصل — E2E');if(callState.pc.connectionState==='failed')setCallStatus('قطع ارتباط…')};
}
function showCallUI(peer,isVideo,status){
  $('#callOverlay').hidden=false;
  const av=$('#callAvatar');
  av.innerHTML=peer.avatar?.startsWith('data:')?'<img src="'+peer.avatar+'">':(peer.avatar||'👤');
  av.style.setProperty('--c',peer.color||'#7c6cff');
  $('#callName').textContent=peer.name;setCallStatus(status);
  $('#camBtn').style.display=isVideo?'':'none';
  $('#micBtn').classList.toggle('off',!callState.micOn);
  $('#camBtn').classList.toggle('off',!callState.camOn);
  $('#localVideo').style.display=isVideo?'':'none';
}
function setCallStatus(t){$('#callStatus').textContent=t}
function endCall(silent){
  if(callState.peer&&!silent)sendSig(callState.peer.id,{kind:'end'});
  try{if(callState.pc)callState.pc.close()}catch(e){}
  if(callState.local)callState.local.getTracks().forEach(t=>t.stop());
  if(callState.screen)callState.screen.getTracks().forEach(t=>t.stop());
  callState={pc:null,local:null,remote:null,screen:null,peer:null,isVideo:true,pendingOffer:null,pendingFrom:null,micOn:true,camOn:true};
  $('#callOverlay').hidden=true;$('#localVideo').srcObject=null;$('#remoteVideo').srcObject=null;$('#screenVideo').srcObject=null;
}
function showIncoming(peer,isVideo){
  showModal('<div style="text-align:center"><div style="font-size:52px;margin-bottom:8px">'+(isVideo?'🎥':'📞')+'</div><h3>تماس '+(isVideo?'تصویری':'صوتی')+'</h3><p>'+esc(peer.name)+' در حال تماس…</p><div class="modal-actions"><button class="btn ghost" id="decCall">رد</button><button class="btn primary" id="accCall">پاسخ</button></div></div>');
  $('#accCall').onclick=acceptIncoming;
  $('#decCall').onclick=()=>{if(callState.pendingFrom)sendSig(callState.pendingFrom.id,{kind:'end'});callState.pendingOffer=null;callState.pendingFrom=null;hideModal()};
}
async function toggleScreenShare(){
  if(!callState.pc)return;
  if(callState.screen){callState.screen.getTracks().forEach(t=>t.stop());callState.screen=null;$('#screenVideo').style.display='none';$('#screenBtn').classList.remove('off');return}
  try{
    callState.screen=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});
    const track=callState.screen.getVideoTracks()[0];
    const sender=callState.pc.getSenders().find(s=>s.track&&s.track.kind==='video');
    if(sender)await sender.replaceTrack(track);else callState.pc.addTrack(track,callState.screen);
    $('#screenVideo').srcObject=callState.screen;$('#screenVideo').style.display='block';$('#screenBtn').classList.add('off');
    track.onended=()=>toggleScreenShare();
  }catch(e){alert('اشتراک لغو شد.')}
}

function renderAdminSecurity(body){
  body.innerHTML=`
    <div class="admin-section">

    </div>
    <div class="admin-section">
      <h4>💾 بکاپ و بازیابی</h4>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button class="admin-btn primary" data-act="backup-audit">📥 خروجی audit (فایل)</button>
        <button class="admin-btn" data-act="import-audit">📤 وارد کردن audit</button>
      </div>
    </div>
    <div class="admin-section">
      <h4>🚪 خروج</h4>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button class="admin-btn danger" data-act="logout-admin">🚪 خروج از پنل مدیر</button>
        <button class="admin-btn danger" data-act="wipe">🗑 پاک کردن همه داده مدیر</button>
      </div>
    </div>`;
  body.onclick=async e=>{
    const b=e.target.closest('[data-act]');if(!b)return;
    const act=b.dataset.act;
    if(act==='goto-monitor'){$$('#modal .admin-tabs button').forEach(x=>x.classList.remove('active'));$('#modal .admin-tabs button[data-atab="monitor"]').classList.add('active');renderAdminTab('monitor')}
    else if(act==='backup-audit'){
      const text=JSON.stringify(adminAuditFeed,null,2);
      const blob=new Blob([text],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mqx-audit-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
      pushLog('ok','Audit backup exported');
    }else if(act==='import-audit'){
      const inp=document.createElement('input');inp.type='file';inp.accept='.json';
      inp.onchange=async()=>{
        const f=inp.files[0];if(!f)return;
        try{
          const data=JSON.parse(await f.text());
          if(Array.isArray(data)){
            const existing=new Set(adminAuditFeed.map(m=>m.msgId));
            let added=0;
            data.forEach(m=>{if(!existing.has(m.msgId)){adminAuditFeed.push(m);added++}});
            adminAuditFeed.sort((a,b)=>b.ts-a.ts);
            saveAuditLocal();
            pushLog('ok','Imported '+added+' audit msgs');
            alert('وارد شد: '+added+' پیام');
            renderAdminSecurity(body);
          }
        }catch(e){alert('فایل معتبر نیست.')}
      };
      inp.click();
    }else if(act==='logout-admin'){
      if(!confirm('از پنل مدیر خارج می‌شوید؟'))return;
      isAdminMode=false;adminAuditKey=null;
      try{mqttClient&&mqttClient.end()}catch(e){}
      location.reload();
    }else if(act==='wipe'){
      if(!confirm('همه داده مدیر پاک شود؟ (لاگ، مانیتور)'))return;
      if(!confirm('مطمئنید؟ برگشت‌پذیر نیست!'))return;
      localStorage.removeItem(AUDIT_LOCAL_KEY);
      localStorage.removeItem('mqx_blocked_emails');
      pushLog('warn','Admin data wiped');
      location.reload();
    }
  };
}

async function createGroup(name,kind,memberIds=[]){
  const gid=uid();
  const gk=await Crypt.genGroup();
  const raw=await Crypt.exportRaw(gk);
  groupKeys[gid]=gk;

  const members=[{id:me.id,name:me.name,avatar:me.avatar,color:me.color,role:'owner',pub:me.pub}];
  memberIds.forEach(id=>{const u=online[id]?.user;if(u)members.push({id:u.id,name:u.name,avatar:u.avatar,color:u.color,role:'member',pub:online[id].pub})});

  chats[gid]={
    type:kind,
    peer:{id:gid,name,avatar:kind==='channel'?'📢':'👥',color:'#a78bfa'},
    members,messages:[],unread:0,pinned:[],disappear:0,muted:false,
    groupKey:raw,
    perms:{sendMessages:kind==='channel'?'admins':'all'}
  };
  safeSubscribe(T.group(gid));
  await saveChats();renderList();openChat(gid);
  if(memberIds.length>0)distributeGroupKey(chats[gid],raw);
  memberIds.forEach(async id=>{
    const u=online[id]?.user;if(!u)return;
    try{
      const key=await getSharedKey(id,online[id].pub);
      const e=await Crypt.encText(key,raw);
      publish(T.dm(id),{v:7,kind:'group-invite',gid,name,avatar:chats[gid].peer.avatar,chatType:kind,members,iv:e.iv,ct:e.ct,from:{id:me.id,name:me.name}});
    }catch(e){}
  });
  return gid;
}
