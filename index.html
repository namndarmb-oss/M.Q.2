async function vaultBackup(){
  if(!me||!masterKey)return;
  try{
    const hash=await Crypt.sha256(me.email.toLowerCase()+'|vault-v7');
    const snapshot={me:{...me},chats:Object.fromEntries(Object.entries(chats).map(([k,v])=>[k,{type:v.type,peer:v.peer,members:v.members,groupKey:v.groupKey,perms:v.perms,unread:v.unread,pinned:v.pinned,disappear:v.disappear,muted:v.muted,messages:v.messages.map(m=>({id:m.id,mine:m.mine,kind:m.kind,text:m.text,name:m.name,size:m.size,mime:m.mime,ts:m.ts,edited:m.edited,sender:m.sender,senderId:m.senderId,replyTo:m.replyTo,fwd:m.fwd,status:m.status,disappear:m.disappear,linkPreview:m.linkPreview,silent:m.silent,poll:m.poll}))}]))};
    const payload=await Crypt.encJson(masterKey,snapshot);
    publish(T.vault(hash),{salt:masterSalt,blob:payload,ts:Date.now()},true);
  }catch(e){}
}
async function fetchVault(email,password){
  return new Promise(async resolve=>{
    const hash=await Crypt.sha256(email.toLowerCase()+'|vault-v7');
    const topic=T.vault(hash);let done=false,client;
    const fin=v=>{if(done)return;done=true;try{client&&client.end(true)}catch(e){}resolve(v)};
    try{client=mqtt.connect(MQTT_BROKERS[0],{clientId:'vault_'+uid(),clean:true,reconnectPeriod:0,connectTimeout:6000})}catch(e){return resolve(null)}
    setTimeout(()=>fin(null),5000);
    client.on('connect',()=>client.subscribe(topic,{qos:1}));
    client.on('message',async(t,p)=>{if(t!==topic)return;try{const d=JSON.parse(p.toString());const salt=new Uint8Array(unb64(d.salt));const key=await Crypt.deriveKey(password,salt,200000);const data=await Crypt.decJson(key,d.blob);fin({key,salt:d.salt,data})}catch(e){fin(null)}});
    client.on('error',()=>fin(null));
  });
}

function openChatSearch(){$('#chatSearch').hidden=false;$('#chatSearchInput').value='';$('#searchCount').textContent='0';$('#chatSearchInput').focus()}
function onChatSearchInput(){
  const q=$('#chatSearchInput').value.trim().toLowerCase();
  const chat=chats[activeId];if(!chat)return;
  if(!q){$('#searchCount').textContent='0';$$('.row').forEach(r=>r.style.background='');return}
  let count=0;
  chat.messages.forEach(m=>{
    const row=$('[data-mid="'+m.id+'"]');if(!row)return;
    const match=(m.text||m.name||'').toLowerCase().includes(q);
    if(match){row.style.background='rgba(124,108,255,.15)';count++}else{row.style.background=''}
  });
  $('#searchCount').textContent=faNum(count);
}

function compressImg(file,maxDim,quality){
  return new Promise(resolve=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const r=Math.min(maxDim/img.width,maxDim/img.height,1);const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(url);resolve(new File([b],(file.name||'img').replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'}))},'image/jpeg',quality)};
    img.onerror=()=>{URL.revokeObjectURL(url);resolve(file)};
    img.src=url;
  });
}

let mediaRec=null,vChunks=[];
async function startVoice(){
  try{
    const stream=await getMedia(false);
    mediaRec=new MediaRecorder(stream);vChunks=[];
    mediaRec.ondataavailable=e=>{if(e.data.size)vChunks.push(e.data)};
    mediaRec.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      if(!vChunks.length)return;
      const blob=new Blob(vChunks,{type:'audio/webm'});
      const file=new File([blob],'voice-'+Date.now()+'.webm',{type:'audio/webm'});
      await sendFile(file,'voice');
    };
    mediaRec.start();
    const btn=$('#sendBtn');btn.classList.add('rec');btn.querySelector('span').textContent='⏹';
    btn.onclick=()=>{try{mediaRec.stop()}catch(e){}btn.classList.remove('rec');btn.querySelector('span').textContent='➤';btn.onclick=sendText};
  }catch(e){alert(mediaErrMsg(e))}
}

async function sendLocation(){
  if(!navigator.geolocation){alert('پشتیبانی نمی‌شود.');return}
  navigator.geolocation.getCurrentPosition(async pos=>{
    const text=pos.coords.latitude.toFixed(5)+','+pos.coords.longitude.toFixed(5);
    const chat=chats[activeId];if(!chat)return;
    const id=uid();
    chat.messages.push({id,mine:true,kind:'location',text,ts:Date.now(),status:'sent'});
    await saveChats();renderMessages();renderList();
    try{await sendPkt(chat,await buildPkt(chat,{kind:'location',id,text,ts:Date.now()}))}catch(e){}
  },()=>alert('دسترسی رد شد.'));
}

async function sendContact(){
  const chat=chats[activeId];if(!chat)return;
  const name=prompt('نام مخاطب:');if(!name)return;
  const val=prompt('شماره/آیدی:');if(!val)return;
  const id=uid();
  chat.messages.push({id,mine:true,kind:'contact',name,text:val,ts:Date.now(),status:'sent'});
  await saveChats();renderMessages();renderList();
  try{await sendPkt(chat,await buildPkt(chat,{kind:'contact',id,name,text:val,ts:Date.now()}))}catch(e){}
}

$('#dropdown').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b||!activeId)return;
  const act=b.dataset.act;$('#dropdown').hidden=true;
  const chat=chats[activeId];if(!chat)return;
  if(act==='info'){(chat.type==='group'||chat.type==='channel')?openGroupInfo():openProfile()}
  else if(act==='pin-list')openPinnedList();
  else if(act==='gallery')openGallery();
  else if(act==='disappear')openDisappear();
  else if(act==='mute'){chat.muted=!chat.muted;await saveChats();alert(chat.muted?'بی‌صدا':'بی‌صدا برداشته شد')}
  else if(act==='export')exportChat();
  else if(act==='clear'){if(confirm('پاک شود؟')){chat.messages=[];await saveChats();renderMessages();renderList()}}
  else if(act==='delete'){if(confirm('حذف شود؟')){delete chats[activeId];activeId=null;await saveChats();$('#chatView').hidden=true;$('#emptyState').hidden=false;$('#app').classList.remove('show-chat');renderList()}}
});

(async function boot(){
  document.documentElement.dataset.theme='dark';
  try{settings=JSON.parse(localStorage.getItem(LS.settings))||settings}catch(e){}
  await loadAdminConfig();
  const local=await loadProfile();
  if(local){
    $('#authScreen').hidden=false;
    $$('.tabs-auth button').forEach(x=>x.classList.remove('active'));
    document.querySelector('[data-authtab="login"]').classList.add('active');
    $('#signupForm').hidden=true;$('#loginForm').hidden=false;
    return;
  }
  $('#authScreen').hidden=false;$('#signupForm').hidden=false;$('#loginForm').hidden=true;
})();
